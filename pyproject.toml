[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "realty-stage-ai-studio"
version = "0.6.3"
description = "Local AI virtual staging for real-estate listing photos: declutter, restyle, relight, export MLS-ready renders."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "realty-stage-ai-studio contributors" }]
keywords = ["real-estate", "virtual-staging", "inpainting", "depth", "mls", "diffusion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10.3",
  "pydantic>=2.7,<3",
  "typer>=0.12",
  "rich>=13.7",
  "tomli-w>=1.0",
  "loguru>=0.7",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.3,<3",
  "torchvision>=0.18",
  "onnxruntime-gpu>=1.18",
]
cpu = [
  "onnxruntime>=1.18",
]
cv = [
  "opencv-python-headless>=4.9",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-Pillow",
  "pre-commit>=3.7",
]

[project.scripts]
stage = "realty_stage_ai.bootstrap.cli:main"
stage-gui = "realty_stage_ai.bootstrap.desktop:main"

[project.urls]
Homepage = "https://github.com/realty-stage-ai-studio/realty-stage-ai-studio"
Issues = "https://github.com/realty-stage-ai-studio/realty-stage-ai-studio/issues"

[tool.hatch.build.targets.wheel]
packages = ["realty_stage_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["realty_stage_ai", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=realty_stage_ai --cov-report=term-missing"